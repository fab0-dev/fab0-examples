# from fab0-dev/fab0-recipes story--v0.1.0
# Edit everything marked EDIT, then run: fab0-resolve validate
schema: 1
repos:
  # One repo is the home repo: it holds .fab0/, the specs and the run ledgers.
  # For several repos, add one entry per repo (with key: two or three capital letters).
  home: {path: ., github: your-org/your-repo, owner: developer}   # EDIT github
people:                                   # roles → GitHub users
  product-owner: {github: [your-github-user]}   # EDIT: who writes and approves specs
  developer:     {github: [your-github-user]}   # EDIT: who implements tasks in the home repo
tracker:
  kind: github-projects
  owner: your-org                         # EDIT: the user or organisation that owns the project
  project: 1                              # EDIT: the project number
  fields: {stage: Stage, run: Run, waiting: Waiting on}
pipelines: [story]
models:
  claude-code: {deep: opus, balanced: sonnet, fast: haiku}
profiles:
  cheap: {models: {claude-code: {deep: sonnet}}}
