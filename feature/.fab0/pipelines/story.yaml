# from fab0-dev/fab0-examples feature--v0.3.0
pipeline: story
trigger: {issue: {type: Story}}
onStart:
  - git.run-branch
  - pr.open-run: {draft: true}
steps:
  # What the Story needs, within its Feature: a file in the runs repository, reviewed in its own pull request
  # there. The product owner's approval (an approving review, or /approve) approves it, and fab0 merges it.
  - step: requirements
    gate: {human: {owner: product-owner, via: pr}}
    done: {pr: {repo: runs, state: approved}}
  # The two factories build it side by side, each in a child run under this one. The web client binds the
  # contract the service hands back: its units that read it wait until this run accepts it, and the rest of its
  # work goes ahead. An agent accepts what each one hands back once its run is done, against what this run asked
  # for; a rejection sends its run back to rework what was wrong.
  - parallel:
      service:
        - call: {factory: service, pipeline: delivery}
          id: service
          inputs: {spec: spec}
          outputs: {contract: contract, feedback: service-feedback}
          gate: {auto: {agent: acceptor, model: deep}}
          done: {issue: {run: child, status: Done}}
      web:
        - call: {factory: web, pipeline: delivery}
          id: web
          inputs: {spec: spec, upstream: contract}
          outputs: {feedback: web-feedback}
          gate: {auto: {agent: acceptor, model: deep}}
          done: {issue: {run: child, status: Done}}
  # The only judge of the Feature: from what every factory reports about its own area, whether the Feature is
  # done, and the follow-up Stories it still needs. Reviewed like the requirements.
  - step: wrap-up
    gate: {human: {owner: product-owner, via: pr}}
    done: {pr: {repo: runs, state: approved}}
  # Open: a follow-up Story per gap, under the same Feature; each is a run of its own when someone starts it.
  # Done: the Feature closes.
  - when: {artifact: outcome, path: feature, equals: open}
    steps:
      - step: follow-ups
        action: tracker.items
        with: {from: outcome, of: parent, type: Story, title: "{unit.title}", body: "{unit.intent}"}
        done: {issue: {status: Done}}
    else:
      - step: close-feature
        action: tracker.close
        with: {item: parent}
        done: {issue: {status: Done}}
onEnd:
  - git.sync-base
  - pr.merge # the run pull request in the runs repository, once its required checks pass
  - tracker.close
