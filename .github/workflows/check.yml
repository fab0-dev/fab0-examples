name: check

on:
  pull_request:
  push:
    branches: [main]
  # A fab0-core change can break an example without a change here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Until fab0 0.6 is released (REFACTOR.md, R8), the examples follow fab0-core's main branch. From then on,
      # check out the release that the fab0 marketplace points at, which is what a project installs.
      - uses: actions/checkout@v4
        with:
          repository: fab0-dev/fab0-core
          path: .fab0-core
      - uses: astral-sh/setup-uv@v6
      - name: Every example copies into an empty repository and validates
        run: FAB0_RESOLVE=.fab0-core/plugins/fab0/bin/fab0-resolve scripts/check-examples
