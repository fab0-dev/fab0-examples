name: check

on:
  pull_request:
  push:
    branches: [main]
  # A fab0-core change can break an example without a change here.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The engine of fab0-core's main until fab0 0.8 is released (fab0-dev/fab0's MIGRATION.md, step N12): the
      # feature and delivery examples need connected factories. Then back to the release the marketplace points at.
      - uses: actions/checkout@v4
        with:
          repository: fab0-dev/fab0-core
          path: .fab0-core
          ref: main
      - uses: astral-sh/setup-uv@v6
      - name: Every example copies into an empty repository and validates
        run: FAB0_RESOLVE=.fab0-core/plugins/fab0/bin/fab0-resolve scripts/check-examples
