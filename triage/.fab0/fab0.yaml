# from fab0-dev/fab0-examples triage--v0.3.0
# Not a delivery factory: new bug reports are classified in the tracker, checked, labelled, and escalated to
# on-call when severe. No pull requests: the run's state and its record are its issues in the runs repository.
schema: 3
repos:
  home: {path: ., github: OWNER/REPO, owner: support} # EDIT
people:
  # EDIT: the GitHub users in each role.
  support: {github: [USER]}
  on-call: {github: [USER]}
tracker: {kind: github, owner: OWNER} # EDIT
git: {branching: flat}
# EDIT: the run tracker: a Pipeline Run issue for each run, with a Pipeline Step sub-issue for each of its steps,
# in the runs repository, which every factory of a product shares.
tracking: {kind: github, github: OWNER/REPO-runs}
models:
  claude-code: {deep: opus, balanced: sonnet, fast: haiku}
pipelines: [triage]
